version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aegis_quant_ai
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: python apps/api/main.py
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis:secure_password_123@postgres:5432/aegis_quant_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  default:
    name: aegis_network
